services:
  - type: web
    name: campusone
    runtime: docker
    plan: starter
    region: singapore
    healthCheckPath: /api/health
    disk:
      name: campusone-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: CAMPUSONE_DATA_DIR
        value: /data
      - key: COOKIE_SECURE
        value: "1"
      - key: CAMPUSONE_SECRET
        generateValue: true
      - key: CAMPUSONE_ADMIN_EMAIL
        sync: false
